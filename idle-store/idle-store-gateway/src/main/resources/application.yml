server:
  port: 8080

spring:
  application:
    name: idle-store-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://idle-store-auth
              predicates:
                - Path=/auth/**
            - id: user
              uri: lb://idle-store-user
              predicates:
                - Path=/user/**
            - id: oss
              uri: lb://idle-store-oss
              predicates:
                - Path=/file/**
            - id: chat-websocket
              uri: lb:ws://idle-store-chat
              predicates:
                - Path=/ws/chat
            - id: chat
              uri: lb://idle-store-chat
              predicates:
                - Path=/chat/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600
  config:
    import:
      - classpath:config/sa-token.yml

# 内部端点拦截：禁止经网关外部访问
gateway:
  internal-paths:
    blocked-prefixes:
      - /user/internal/